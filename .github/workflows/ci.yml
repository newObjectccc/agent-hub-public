# 全量验证流水线：build + lint + test（对应 README 的 `pnpm -r build/lint/test` 基线）
# 矩阵：Node 20（engines 下限）/ 22（开发主力）× Ubuntu / macOS。
# Windows 兼容由 cli 的平台 mock 测试覆盖（autostart/detect 等 win32 分支），CI 不跑 Windows runner。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm -r build

      - name: 类型/lint 检查
        run: pnpm -r lint

      - name: 测试
        run: pnpm -r test
